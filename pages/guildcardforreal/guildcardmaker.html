<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Guild Card Maker</title>
  <script src="scripts/html2canvas.js"></script>
  <link href="css/style_gm.css" rel="stylesheet" type="text/css" media="all">
</head>
<body>

<div class="form">
  Hunter Name<input type="text" id="input-name" placeholder="Hunter Name" maxlength="27">
  Title<input type="text" id="tit" placeholder="Titulo" maxlength="20">
  Favorite Game
                <select id="favGame" name="disc">
                    <option value="mh1">Monster Hunter 1</option>
                    <option value="mh1g">Monster Hunter 1G</option>
                    <option value="mhf1">Monster Hunter Freedom</option>
                    <option value="mh2">Monster Hunter 2</option>
                    <option value="mhf2">Monster Hunter Freedom 2</option>
                    <option value="mh2g">Monster Hunter Freedom Unite</option>
                    <option value="mh3">Monster Hunter 3</option>
                    <option value="mhp3">Monster Hunter 3 Portable</option>
                    <option value="mh3u">Monster Hunter 3 Ultimate</option>
                    <option value="mh4">Monster Hunter 4</option>
                    <option value="mh4u">Monster Hunter 4 Ultimate</option>
                    <option value="mhg">Monster Hunter Generations</option>
                    <option value="mhgu">Monster Hunter Generations Ultimate</option>
                    <option value="mhwi">Monster Hunter World Iceborne</option>
                    <option value="mhrs">Monster Hunter Rise Sunbreak</option>
                    <option value="mhws">Monster Hunter Wilds</option>
                    <option value="mhfzz">Monster Hunter Frontier ZZ</option>
            </select>
  Description<textarea id="input-desc" placeholder="Descrição" rows="10" maxlength="500"></textarea>
  Favorite Monster<input type="text" id="favMon" placeholder="Hunter Name">
  Monster Icon<input type="file" id="input-icon">
  Profile Picture<input type="file" id="input-profile">
  Background Image<input type="file" id="input-bg">
  Screenshots (Up to 3)<input type="file" id="input-gallery" multiple>
    Favorite Weapons
    <div id="weapon-list">
    <label><input type="checkbox" value="GS"><span>Greatsword</span></label>
    <label><input type="checkbox" value="LS"><span>Longsword</span></label>
    <label><input type="checkbox" value="SnS"><span>Sword and Shield</span></label>
    <label><input type="checkbox" value="DB"><span>Dual Blades</span></label>
    <label><input type="checkbox" value="HAM"><span>Hammer</span></label>
    <label><input type="checkbox" value="HH"><span>Hunting Horn</span></label>
    <label><input type="checkbox" value="LAN"><span>Lance</span></label>
    <label><input type="checkbox" value="GL"><span>Gunlance</span></label>
    <label><input type="checkbox" value="SA"><span>Switch Axe</span></label>
    <label><input type="checkbox" value="CB"><span>Charge Blade</span></label>
    <label><input type="checkbox" value="IG"><span>Insect Glave</span></label>
    <label><input type="checkbox" value="BOW"><span>Bow</span></label>
    <label><input type="checkbox" value="LBG"><span>Light Bowgun</span></label>
    <label><input type="checkbox" value="HBG"><span>Heavy Bowgun</span></label>
    <label><input type="checkbox" value="TF"><span>Tonfa</span></label>
    <label><input type="checkbox" value="MS"><span>Magnet Spike</span></label>
  </div>

  <button onclick="generateCard()">Gerar</button>
  <button onclick="downloadCard()">Baixar PNG</button>
</div>

<div id="card">
  <img src="imagens/backgroundgradiante.png" id="bg-grad">
  <img id="bg">
  <img id="profile">
  <div id="name"></div>
  <div id="title"></div>
  <div id="favmons">
    Favorite Monster:<div id="famon"></div>
    <img id="icon">
  </div>
  <div id="Fg-cont">
    <div id="favGam-te">Favorite Game:</div>
    <div id="favGam"></div>

  </div>
  <div id="desc-bg">
    About me:<div id="desc"></div>

  </div>
  <div class="gallery">
    <img id="g0">
    <img id="g1">
    <img id="g2">
  </div>
  <div id="weapon-cont">
    <div class="weapons" id="weapons"></div>
  </div>
</div>

<script src="scripts/script2_gm.js"></script>

</body>
</html>
