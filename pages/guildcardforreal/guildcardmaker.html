<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Guild Card Maker</title>
  <script src="scripts/html2canvas.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="css/style_gm.css" rel="stylesheet" type="text/css" media="all">
</head>
<body>
  <div class="form">
  <a href="/index.html" data-i18n="returnToMain">Return to main page...</a><br>
  <h1>Nimbos' Guild Card Maker</h1><br>
  <select id="lang" onchange="setLanguage(this.value)">
    <option value="en">English</option>
    <option value="pt" selected>Português</option>
    <option value="jp" selected>日本語</option>
  </select><br>
  <span data-i18n="profilePicture">Profile Picture</span><input type="file" id="input-profile" accept="image/png, image/jpeg, .png, .jpg, .jpeg">
  <span data-i18n="hunterName">Hunter Name</span><input type="text" id="input-name" placeholder="Josuke Joestar" maxlength="27">
  <span data-i18n="title">Title</span><input type="text" id="tit" placeholder="Great Researcher" maxlength="20">
  <span data-i18n="favoriteGame">Favorite Game</span>
                <select id="favGame" name="disc">
                    <option value="mh1">Monster Hunter 1</option>
                    <option value="mh1g">Monster Hunter 1G</option>
                    <option value="mhf1">Monster Hunter Freedom</option>
                    <option value="mh2">Monster Hunter 2 (Dos)</option>
                    <option value="mhf2">Monster Hunter Freedom 2</option>
                    <option value="mh2g">Monster Hunter Freedom Unite</option>
                    <option value="mh3">Monster Hunter 3 (Tri)</option>
                    <option value="mhp3">Monster Hunter 3 Portable</option>
                    <option value="mh3u">Monster Hunter 3 Ultimate</option>
                    <option value="mh4">Monster Hunter 4</option>
                    <option value="mh4u">Monster Hunter 4 Ultimate</option>
                    <option value="mhg">Monster Hunter Generations</option>
                    <option value="mhgu">Monster Hunter Generations Ultimate</option>
                    <option value="mhwi">Monster Hunter World Iceborne</option>
                    <option value="mhrs">Monster Hunter Rise Sunbreak</option>
                    <option value="mhws">Monster Hunter Wilds</option>
                    <option value="mhfront">Monster Hunter Frontier</option>
                    <option value="mhfg">Monster Hunter Frontier G</option>
                    <option value="mhfzz">Monster Hunter Frontier ZZ</option>
                    <option value="mhst1">Monster Hunter Stories 1</option>
                    <option value="mhst2">Monster Hunter Stories 2</option>
                    <option value="mhst3">Monster Hunter Stories 3</option>
                    <option value="mhon">Monster Hunter Online</option>
            </select>
  <span data-i18n="description">Description</span><textarea id="input-desc" 
  placeholder="I like chicken nuggets  
  

my socials are....." rows="10" maxlength="500"></textarea>
  <span data-i18n="favoriteMonster">Favorite Monster</span><input type="text" id="favMon" placeholder="Rathalos">
  <span data-i18n="monsterIcon">Monster Icon</span><input type="file" id="input-icon" accept="image/png, image/jpeg, .png, .jpg, .jpeg">
  <span data-i18n="backgroundImage">Background Image</span><input type="file" id="input-bg" accept="image/png, image/jpeg, .png, .jpg, .jpeg">
  <span data-i18n="screenshots">Screenshots (Max of 3)</span><input type="file" id="input-gallery" multiple accept="image/png, image/jpeg, .png, .jpg, .jpeg">
    <span data-i18n="favoriteWeapons">Favorite Weapons</span>
    <div id="weapon-list">
    <label><input type="checkbox" value="GS"><span data-i18n="greatsword">Greatsword</span></label>
    <label><input type="checkbox" value="LS"><span data-i18n="longsword">Longsword</span></label>
    <label><input type="checkbox" value="SnS"><span data-i18n="swordAndShield">Sword and Shield</span></label>
    <label><input type="checkbox" value="DB"><span data-i18n="dualBlades">Dual Blades</span></label>
    <label><input type="checkbox" value="HAM"><span data-i18n="hammer">Hammer</span></label>
    <label><input type="checkbox" value="HH"><span data-i18n="huntingHorn">Hunting Horn</span></label>
    <label><input type="checkbox" value="LAN"><span data-i18n="lance">Lance</span></label>
    <label><input type="checkbox" value="GL"><span data-i18n="gunlance">Gunlance</span></label>
    <label><input type="checkbox" value="SA"><span data-i18n="switchAxe">Switch Axe</span></label>
    <label><input type="checkbox" value="CB"><span data-i18n="chargeBlade">Charge Blade</span></label>
    <label><input type="checkbox" value="IG"><span data-i18n="insectGlave">Insect Glave</span></label>
    <label><input type="checkbox" value="BOW"><span data-i18n="bow">Bow</span></label>
    <label><input type="checkbox" value="LBG"><span data-i18n="lightBowgun">Light Bowgun</span></label>
    <label><input type="checkbox" value="HBG"><span data-i18n="heavyBowgun">Heavy Bowgun</span></label>
    <label><input type="checkbox" value="TF"><span data-i18n="tonfa">Tonfa</span></label>
    <label><input type="checkbox" value="MS"><span data-i18n="magnetSpike">Magnet Spike</span></label>
  </div>

  <button onclick="generateCard()" data-i18n="createGuildCard">Create Guild Card</button>
  <button onclick="downloadCard()" data-i18n="downloadGuildCard">Download Guild Card</button>
</div>

<div id="card">
  <img src="imagens/backgroundgradiante.png" id="bg-grad">
  <img id="bg" src="./imagens/wood.png">
  <img id="profile" src="./imagens/questionmark.png">
  <div id="name"></div>
  <div id="title"></div>
  <div id="favmons">
    <span data-i18n="favoriteMonsterLabel">Favorite Monster:</span><div id="famon"></div>
    <img id="icon" src="./imagens/questionmark.png">
  </div>
  <div id="Fg-cont">
    <div id="favGam"></div>
    
  </div>
  <img src="./imagens/star.png" id="star1">
  <div id="desc-bg">
    <span data-i18n="aboutMe">About me:</span><div id="desc"></div>

  </div>
  <div class="gallery">
    <img id="g0" src="./imagens/questionmark.png" >
    <img id="g1" src="./imagens/questionmark.png" >
    <img id="g2" src="./imagens/questionmark.png" >
  </div>
  <div id="weapon-cont">
    <div class="weapons" id="weapons"></div>
  </div>
</div>

<script src="scripts/script2_gm.js"></script>

</body>
</html>
